name: Validate agent branch

on:
  push:
    branches:
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "hotfix/**"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/asr-mt/requirements.txt

      - name: Install frontend deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Python deps
        working-directory: services/asr-mt
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        working-directory: services/asr-mt
        run: python -m compileall app

      - name: Python tests
        working-directory: services/asr-mt
        run: python -m pytest -q
        env:
          APP_ENV: test
          SESSION_SIGNING_KEY: ci-test-session-signing-key
